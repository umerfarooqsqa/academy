name: Deploy to Cloudflare Workers

# 2026-10-12 — CLAUDE.md Section 4 deviation (Cloudflare Workers hosting).
# Runs on Cloudflare's own Linux runners, not the operator's Windows machine —
# sidesteps @opennextjs/cloudflare's "not fully compatible with Windows"
# caveat entirely for day-to-day deploys. Requires one repo secret:
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit permission) — set it under
# Settings > Secrets and variables > Actions in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run cf:build

      - uses: cloudflare/wrangler-action@v3
        env:
          # `opennextjs-cloudflare deploy` (which `wrangler deploy` calls into
          # for this project) reads Worker bindings via Wrangler's local-
          # emulation API (getPlatformProxy) as part of its own deploy prep —
          # verified live in this exact CI job: without this var present it
          # throws "you should use a local Postgres connection string to
          # emulate Hyperdrive" and fails before ever reaching the real
          # deploy. This value is never actually connected to — the deployed
          # Worker's real Hyperdrive binding comes from wrangler.jsonc's `id`
          # field regardless — so a syntactically-valid placeholder is fine.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: "postgresql://user:pass@localhost:5432/placeholder"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
